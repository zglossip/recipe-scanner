plugins {
    id 'java-library'
    id 'maven-publish'
}

group = "com.zglossip.recipecatalog"
version = System.getenv('GITHUB_REF_NAME')?.replaceFirst(/^v/, '') ?: '0.0.2-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.0.5')
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework.boot:spring-boot-restclient'

    annotationProcessor platform('org.springframework.boot:spring-boot-dependencies:4.0.5')
    annotationProcessor 'org.springframework.boot:spring-boot-autoconfigure-processor'

    compileOnly 'org.slf4j:slf4j-api'

    implementation 'org.apache.pdfbox:pdfbox:3.0.4'
    implementation 'net.sourceforge.tess4j:tess4j:5.13.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'jakarta.validation:jakarta.validation-api'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/zglossip/recipe-catalog-scanner')
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}